name: Test scala
on:
  push:
    branches:
      - '**' # matches every branch
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v1
        - uses: olafurpg/setup-scala@v11
        - name: Compile
          run: sbt compile
        - name: Test
          run: sbt test
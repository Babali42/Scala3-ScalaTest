name: Test scala
on:
  push:
  pull_request:
    branches: [ "trunk" ]
    
jobs:
    build-and-test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '25'
        - name: Setup sbt launcher
          uses: sbt/setup-sbt@v1
        - name: Compile
          run: sbt compile
        - name: Test
          run: sbt test